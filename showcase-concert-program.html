                            </div>
                        </div>
                    </header>

                    <div className="max-w-2xl mx-auto space-y-6 px-4">
                        <h2 className="text-center font-serif text-[#061735] uppercase tracking-[0.4em] text-xs mb-4">{t.menuHeader}</h2>
                        <NavButton icon={Music} title={t.programCardTitle} onClick={() => setView('program')} />
                        <NavButton icon={Users} title={t.musiciansCardTitle} onClick={() => setView('musicians')} />
                        <div className="grid grid-cols-2 gap-4">
                            <NavButton icon={Heart} title={t.specialThanks} onClick={() => setView('thanks')} small />
                            <NavButton icon={Trophy} title={t.nextEvents} onClick={() => setView('upcoming')} small />
                        </div>
                    </div>
                </div>
            );

            const renderProgram = () => (
                <div className="max-w-2xl mx-auto animate-fade-in-up px-4">
                    <h2 className="font-serif text-4xl md:text-5xl text-[#061735] mb-8 border-l-4 border-brand-gold pl-6">{t.programCardTitle}</h2>
                    <div className="glass-card p-8 rounded-3xl space-y-12">
                        <div className="text-center">
                            <h3 className="text-brand-gold uppercase tracking-[0.3em] text-xs font-bold mb-3">{t.conductorTitle}</h3>
                            <p className="text-2xl md:text-3xl font-serif text-white flex flex-wrap justify-center gap-x-3 gap-y-1">
                                <span className="whitespace-nowrap">{t.conductors[0]}</span>
                                <span className="opacity-50">{t.conductors[1]}</span>
                                <span className="whitespace-nowrap">{t.conductors[2]}</span>
                            </p>
                        </div>
                        <div className="space-y-10">
                            <h3 className="text-brand-gold uppercase tracking-[0.3em] text-xs font-bold text-center border-b border-orange-400/30 pb-4">{t.selectionsHeader}</h3>
                            <div className="space-y-8">
                                {t.selections.map((song, i) => (
                                    <div key={i} className="flex items-start gap-6 group">
                                        <span className="text-brand-gold font-serif text-2xl italic opacity-50">0{i+1}</span>
                                        <h4 className="text-2xl md:text-3xl text-white font-serif leading-tight group-hover:text-brand-gold transition-colors">{song}</h4>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </div>
                </div>
            );

            const renderMusicians = () => (
                <div className="max-w-3xl mx-auto animate-fade-in-up px-4 pb-12">
                    <h2 className="font-serif text-4xl md:text-5xl text-[#061735] mb-8 border-l-4 border-brand-gold pl-6">{t.musiciansCardTitle}</h2>
                    <div className="space-y-8">
                        {INSTRUMENT_SCORE_ORDER.map(inst => {
                            const players = groupedRoster[inst];
                            if (!players) return null;
                            return (
                                <div key={inst} className="glass-card p-6 rounded-2xl overflow-hidden relative">
                                    <div className="absolute top-0 right-0 p-6 opacity-5 pointer-events-none">
                                        <Music size={100} />
                                    </div>
                                    <h3 className="font-serif text-2xl text-brand-gold mb-6 border-b border-brand-gold/20 pb-2">{inst}</h3>
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-x-12 gap-y-3">
                                        {players.map((p, i) => (
                                            <div key={i} className="flex border-b border-orange-400/10 py-1 group hover:border-brand-gold/30 transition-colors">
                                                <span className="text-blue-50 font-normal uppercase tracking-tight text-sm md:text-base">
                                                    {p.first} {p.last}
                                                </span>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            );
                        })}
                    </div>
                </div>
            );

            const renderThanks = () => (
                <div className="max-w-2xl mx-auto animate-fade-in-up px-4 pb-12 space-y-8">
                    <h2 className="font-serif text-4xl md:text-5xl text-[#061735] mb-8 border-l-4 border-brand-gold pl-6">{t.specialThanks}</h2>
                    <div className="glass-card p-8 rounded-3xl space-y-6">
                        <h3 className="text-brand-gold uppercase tracking-widest text-sm font-bold">{t.thanksHeader}</h3>
                        <p className="text-blue-50 italic text-lg">{t.thanksIntro}</p>
                        <ul className="grid grid-cols-1 gap-4">
                            {t.thanksStaff.map((s, i) => (
                                <li key={i} className="text-white border-l-2 border-orange-400 pl-4 py-1">{s}</li>
                            ))}
                        </ul>
                        <p className="text-brand-gold text-sm pt-4 border-t border-orange-400/30">{t.thanksClosing}</p>
                    </div>
                    <div className="glass-card p-8 rounded-3xl space-y-6 relative overflow-hidden">
                        <div className="absolute -bottom-4 -right-4 text-brand-gold opacity-10">
                            <Trophy size={150} />
                        </div>
                        <h3 className="text-brand-gold uppercase tracking-widest text-sm font-bold flex items-center gap-2">
                            <Trophy size={16} /> {t.fundraiserHeader}
                        </h3>
                        <p className="text-blue-50 leading-relaxed">{t.fundraiserIntro}</p>
                        <div className="flex flex-wrap gap-2">
                            {t.topDonors.map((d, i) => (
                                <span key={i} className="bg-blue-950/35 border border-orange-400/30 text-blue-50 px-3 py-1 rounded-md text-sm">
                                    {d}
                                </span>
                            ))}
                        </div>
                    </div>
                </div>
            );

            const renderUpcoming = () => (
                <div className="max-w-2xl mx-auto animate-fade-in-up px-4">
                    <h2 className="font-serif text-4xl md:text-5xl text-[#061735] mb-8 border-l-4 border-brand-gold pl-6">{t.nextEvents}</h2>
                    <div className="glass-card p-8 rounded-3xl">
                        <Calendar className="w-16 h-16 md:w-12 md:h-12 text-orange-300 mx-auto mb-6" />
                        <h3 className="text-3xl md:text-2xl font-black text-white mb-4 text-center">{t.endOfYearHeader}</h3>
                        <p className="text-blue-100 leading-relaxed mb-8 text-center max-w-2xl mx-auto text-base md:text-sm">{t.endOfYearIntro}</p>
                        <div className="space-y-5 text-left max-w-2xl mx-auto w-full">
                            {t.endOfYearItems.map((item, i) => (
                                <div key={i} className="bg-blue-950/35 border border-orange-400/30 rounded-xl p-5">
                                    <h4 className="text-orange-300 font-black uppercase tracking-wider text-base md:text-sm mb-2">{item.title}</h4>
                                    <p className="text-blue-50 text-lg md:text-base leading-relaxed">{item.body}</p>
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            );

            return (
                <div className="min-h-screen relative pb-12 selection:bg-orange-400 selection:text-blue-950">
                    <PageBackground />
                    <nav className="sticky top-0 z-50 p-4 md:p-6 bg-[#fff4df]/95 backdrop-blur-md border-b-2 border-orange-400/50 mb-4 shadow-lg shadow-orange-900/10">
                        <div className="max-w-5xl mx-auto flex justify-between items-center">
                            {view !== 'home' ? (
                                <button 
                                    onClick={() => setView('home')} 
                                    className="flex items-center gap-2 text-[#061735] hover:text-orange-600 transition-colors uppercase tracking-[0.2em] font-bold text-xs"
                                >
                                    <ChevronLeft size={16} /> {t.back}
                                </button>
                            ) : <div className="font-serif text-[#061735] uppercase tracking-[0.2em] font-black text-lg">DMS BAND</div>}
                            <button 
                                onClick={() => setLang(l => l === 'en' ? 'es' : 'en')}
                                className="flex items-center gap-2 px-4 py-2 bg-[#061735] text-orange-300 rounded-full font-bold text-xs uppercase tracking-widest hover:scale-105 active:scale-95 transition-all border-2 border-orange-400/70 shadow-md shadow-blue-950/20"
                            >
                                <Globe size={14} /> {lang === 'en' ? 'Español' : 'English'}
                            </button>
                        </div>
                    </nav>
                    <main className="container mx-auto">
                        {view === 'home' && renderHome()}
                        {view === 'program' && renderProgram()}
                        {view === 'musicians' && renderMusicians()}
                        {view === 'thanks' && renderThanks()}
                        {view === 'upcoming' && renderUpcoming()}
                    </main>
                    <footer className="mt-20 text-center opacity-70 pb-10">
                        <p className="font-serif text-sm tracking-[0.5em] text-[#061735]">DEAN MIDDLE SCHOOL FINE ARTS</p>
                    </footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
