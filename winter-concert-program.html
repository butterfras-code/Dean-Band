                            <p className="text-slate-300 text-base md:text-sm">Dean Middle School</p>
                        </Card>
                        <Card onClick={() => setView('concertWinds')}>
                            <h3 className="text-2xl md:text-xl font-bold text-white mb-2">{t.concertWinds}</h3>
                            <p className="text-slate-300 text-base md:text-sm">Dean Middle School</p>
                        </Card>
                        <Card onClick={() => setView('symphonicWinds')}>
                            <h3 className="text-2xl md:text-xl font-bold text-white mb-2">{t.symphonicWinds}</h3>
                            <p className="text-slate-300 text-base md:text-sm">Dean Middle School</p>
                        </Card>
                    </div>

                    <div className="mt-12 grid grid-cols-2 gap-5 max-w-lg mx-auto">
                        <Card onClick={() => setView('thanks')} className="h-full flex flex-col items-center justify-center py-8">
                            <Heart className="w-8 h-8 md:w-6 md:h-6 text-red-400 mb-3" />
                            <span className="text-white font-semibold text-lg md:text-base">{t.specialThanks}</span>
                        </Card>
                        <Card onClick={() => setView('events')} className="h-full flex flex-col items-center justify-center py-8">
                            <Info className="w-8 h-8 md:w-6 md:h-6 text-blue-400 mb-3" />
                            <span className="text-white font-semibold text-lg md:text-base">{t.nextEvents}</span>
                        </Card>
                    </div>
                </div>
            );

            const renderGroupPage = (groupName, titleKey) => {
                const sortedStudents = getGroupData(groupName);
                const byInstrument = sortedStudents.reduce((acc, student) => {
                    const inst = student.instrument || "Unknown";
                    if (!acc[inst]) acc[inst] = [];
                    acc[inst].push(student);
                    return acc;
                }, {});

                // Get the correct conductor and selections based on the band
                let conductorName = "";
                let selections = [];

                if (titleKey === 'symphonicWinds') {
                    conductorName = t.conductorSymphonicWinds;
                    selections = t.selectionsSymphonicWinds;
                } else if (titleKey === 'symphonicBand') {
                    conductorName = t.conductorSymphonicBand;
                    selections = t.selectionsSymphonicBand;
                } else if (titleKey === 'concertWinds') {
                    conductorName = t.conductorConcertWinds;
                    selections = t.selectionsConcertWinds;
                }

                return (
                    <div className="animate-in slide-in-from-right duration-300">
                        <h2 className="text-4xl md:text-3xl font-serif font-bold text-white mb-3 text-center">{t[titleKey]}</h2>
                        <p className="text-center text-slate-300 mb-10 text-lg md:text-base">{t.conductor}: <span className="text-white italic">{conductorName}</span></p>
                        <div className="bg-slate-800/60 rounded-2xl p-6 md:p-8 mb-10 border-2 border-slate-700">
                            <h3 className="text-yellow-400 font-bold uppercase tracking-wider text-lg md:text-sm mb-6 text-center border-b-2 border-slate-700 pb-3">{t.program}</h3>
                            <ul className="space-y-5 md:space-y-4">
                                {selections.map((song, idx) => (
                                    <li key={idx} className="text-center">
                                        <span className="text-white font-semibold text-xl md:text-lg">{song}</span>
                                    </li>
                                ))}
                            </ul>
                        </div>
                        <SectionHeader title={t.musicians} />
                        <div className="grid grid-cols-1 gap-8 md:gap-6 pb-24">
                            {INSTRUMENT_SCORE_ORDER.map(inst => {
                                if (!byInstrument[inst]) return null;
                                return (
                                    <div key={inst} className="mb-4 bg-slate-800/40 rounded-xl p-6 md:p-5 border border-slate-700">
                                        <h4 className="text-yellow-400 font-bold mb-4 text-xl md:text-lg text-center md:text-left">{inst}</h4>
                                        <ul className="space-y-2.5 md:space-y-1.5">
                                            {byInstrument[inst].map((s, i) => (
                                                <li key={i} className="text-slate-100 text-lg md:text-base text-center md:text-left leading-relaxed">{s.first} {s.last}</li>
                                            ))}
                                        </ul>
                                    </div>
                                );
                            })}
                        </div>
                    </div>
                );
            };

            const renderInfoPage = (type) => (
                <div className="animate-in slide-in-from-right duration-300 h-full">
                    <div className="bg-slate-800/90 p-8 md:p-10 rounded-2xl border-2 border-slate-700">
                        {type === 'thanks' ? (
                            <>
                                <Heart className="w-16 h-16 md:w-12 md:h-12 text-red-500 mx-auto mb-6" />
                                <h2 className="text-3xl md:text-2xl font-serif font-bold text-white mb-6 text-center">{t.thanksHeader}</h2>

                                <div className="text-left max-w-2xl mx-auto">
                                    <p className="text-slate-200 leading-relaxed mb-6 text-lg md:text-base">{t.thanksIntro}</p>

                                    <ul className="space-y-2 text-slate-300 text-base md:text-sm mb-6">
                                        {t.thanksStaff.map((staff, idx) => (
                                            <li key={idx} className="leading-relaxed">{staff}</li>
                                        ))}
                                    </ul>

                                    <p className="text-slate-200 leading-relaxed mb-8 text-lg md:text-base">{t.thanksClosing}</p>

                                    <div className="border-t-2 border-slate-700 pt-8 mt-8">
                                        <h3 className="text-yellow-400 font-bold text-xl md:text-lg mb-4 text-center">{t.fundraiserHeader}</h3>
                                        <p className="text-slate-200 leading-relaxed mb-6 text-base md:text-sm">{t.fundraiserIntro}</p>

                                        <ul className="grid grid-cols-1 md:grid-cols-2 gap-2 text-slate-300 text-base md:text-sm">
                                            {t.topDonors.map((donor, idx) => (
                                                <li key={idx} className="leading-relaxed">• {donor}</li>
                                            ))}
                                        </ul>
                                    </div>
                                </div>
                            </>
                        ) : (
                            <>
                                <Calendar className="w-16 h-16 md:w-12 md:h-12 text-blue-500 mx-auto mb-6" />
                                <h2 className="text-3xl md:text-2xl font-serif font-bold text-white mb-6 text-center">{t.upcomingHeader}</h2>
                                <ul className="space-y-6 md:space-y-4 text-left max-w-2xl mx-auto w-full">
                                    {t.upcomingEvents.map((event, idx) => (
                                        <li key={idx} className="flex flex-col border-b border-slate-700 pb-4 last:border-0">
                                            <div className="flex items-baseline gap-3 mb-1">
                                                <span className="text-yellow-400 font-bold text-base md:text-sm whitespace-nowrap">{event.date}</span>
                                                <span className="text-white font-bold text-xl md:text-lg">{event.title}</span>
                                            </div>
                                            {event.description && (
                                                <span className="text-slate-300 text-base md:text-sm mt-1 ml-0">{event.description}</span>
                                            )}
                                        </li>
                                    ))}
                                </ul>
                            </>
                        )}
                    </div>
                </div>
            );

            return (
                <div className="relative min-h-screen font-sans selection:bg-yellow-500 selection:text-slate-900">
                    <Background />
                    <div className="sticky top-0 z-50 bg-slate-900/95 backdrop-blur-md border-b-2 border-slate-800 px-5 py-4 md:py-3 shadow-xl">
                        <div className="grid grid-cols-3 items-center gap-4">
                            {/* Left: Back Button (when not on home) */}
                            <div className="flex justify-start">
                                {view !== 'home' ? (
                                    <button onClick={() => setView('home')} className="flex items-center text-yellow-400 hover:text-yellow-300 transition-colors font-semibold text-base md:text-sm py-2" style={{ minHeight: '48px' }}>
                                        <ChevronLeft size={24} className="mr-1" />
                                        <span className="hidden sm:inline">{t.back}</span>
                                    </button>
                                ) : (
                                    <div style={{ minHeight: '48px' }}></div>
                                )}
                            </div>

                            {/* Center: Title */}
                            <div className="flex justify-center">
                                <span className="text-slate-300 text-sm md:text-xs font-bold tracking-widest uppercase text-center">Dean MS Band</span>
                            </div>

                            {/* Right: Language Toggle */}
                            <div className="flex justify-end">
                                <button onClick={handleLangToggle} className="flex items-center space-x-2 bg-slate-800 hover:bg-slate-700 active:bg-slate-600 text-yellow-400 px-4 py-2.5 md:py-2 rounded-full text-base md:text-sm font-semibold transition-colors border-2 border-slate-700" style={{ minHeight: '48px' }}>
                                    <Globe size={18} />
                                    <span>{lang === 'en' ? 'Español' : 'English'}</span>
                                </button>
                            </div>
                        </div>
                    </div>
                    <main className="relative z-10 container mx-auto px-5 md:px-4 py-10 md:py-8 max-w-3xl">
                        {view === 'home' && renderHome()}
                        {view === 'symphonicBand' && renderGroupPage('Symphonic Band', 'symphonicBand')}
                        {view === 'concertWinds' && renderGroupPage('Concert Winds', 'concertWinds')}
                        {view === 'symphonicWinds' && renderGroupPage('Symphonic Winds', 'symphonicWinds')}
                        {view === 'thanks' && renderInfoPage('thanks')}
                        {view === 'events' && renderInfoPage('events')}
                    </main>
                    <footer className="relative z-10 text-center py-8 text-slate-500 text-base md:text-xs">
                        <p>&copy; 2025 Dean Middle School Band</p>
                    </footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<WinterConcertProgram />);
    </script>
</body>

</html>
