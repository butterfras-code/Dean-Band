            };

            const renderInfoPage = (type) => (
                <div className="animate-in slide-in-from-right duration-300 h-full">
                    <button onClick={() => setView('home')} className="flex items-center text-yellow-400 hover:text-yellow-300 mb-8 transition-colors font-semibold text-lg md:text-base py-3 px-1" style={{ minHeight: '48px' }}>
                        <ChevronLeft size={24} className="mr-2" />
                        {t.back}
                    </button>
                    <div className="bg-slate-800/90 p-8 md:p-10 rounded-2xl border-2 border-slate-700 text-center">
                        {type === 'thanks' ? (
                            <>
                                <Heart className="w-16 h-16 md:w-12 md:h-12 text-red-500 mx-auto mb-6" />
                                <h2 className="text-3xl md:text-2xl font-serif font-bold text-white mb-6">{t.thanksHeader}</h2>
                                <p className="text-slate-200 leading-relaxed mb-8 text-lg md:text-base">{t.thanksBody}</p>
                                <div className="space-y-3 text-slate-300 text-base md:text-sm">
                                    <p className="font-medium">Dean Middle School Administration</p>
                                    <p className="font-medium">Fine Arts Department</p>
                                    <p className="font-medium">Band Boosters</p>
                                </div>
                            </>
                        ) : (
                            <>
                                <Calendar className="w-16 h-16 md:w-12 md:h-12 text-blue-500 mx-auto mb-6" />
                                <h2 className="text-3xl md:text-2xl font-serif font-bold text-white mb-6">{t.upcomingHeader}</h2>
                                <ul className="space-y-6 md:space-y-4 text-left inline-block">
                                    <li className="flex flex-col">
                                        <span className="text-white font-bold text-xl md:text-lg">Spring Concert</span>
                                        <span className="text-slate-300 text-lg md:text-base mt-1">May 2026</span>
                                    </li>
                                    <li className="flex flex-col">
                                        <span className="text-white font-bold text-xl md:text-lg">UIL Concert & Sight-reading</span>
                                        <span className="text-slate-300 text-lg md:text-base mt-1">April 2026</span>
                                    </li>
                                </ul>
                            </>
                        )}
                    </div>
                </div>
            );

            return (
                <div className="relative min-h-screen font-sans selection:bg-yellow-500 selection:text-slate-900">
                    <Background />
                    <div className="sticky top-0 z-50 bg-slate-900/95 backdrop-blur-md border-b-2 border-slate-800 px-5 py-4 md:py-3 flex justify-between items-center shadow-xl">
                        <span className="text-slate-300 text-sm md:text-xs font-bold tracking-widest uppercase">Dean MS Band</span>
                        <button onClick={handleLangToggle} className="flex items-center space-x-2 bg-slate-800 hover:bg-slate-700 active:bg-slate-600 text-yellow-400 px-4 py-2.5 md:py-2 rounded-full text-base md:text-sm font-semibold transition-colors border-2 border-slate-700" style={{ minHeight: '48px' }}>
                            <Globe size={18} />
                            <span>{lang === 'en' ? 'Español' : 'English'}</span>
                        </button>
                    </div>
                    <main className="relative z-10 container mx-auto px-5 md:px-4 py-10 md:py-8 max-w-3xl">
                        {view === 'home' && renderHome()}
                        {view === 'symphonicBand' && renderGroupPage('Symphonic Band', 'symphonicBand')}
                        {view === 'concertWinds' && renderGroupPage('Concert Winds', 'concertWinds')}
                        {view === 'symphonicWinds' && renderGroupPage('Symphonic Winds', 'symphonicWinds')}
                        {view === 'thanks' && renderInfoPage('thanks')}
                        {view === 'events' && renderInfoPage('events')}
                    </main>
                    <footer className="relative z-10 text-center py-8 text-slate-500 text-base md:text-xs">
                        <p>&copy; 2025 Dean Middle School Band</p>
                    </footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<WinterConcertProgram />);
    </script>
</body>

</html>
