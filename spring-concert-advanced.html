                const safeInstrA = instrA === -1 ? 999 : instrA;

            <div className="flex items-center justify-center space-x-4 my-8">
                <div className="h-px bg-gradient-to-r from-transparent via-orange-400 to-transparent w-20"></div>
                <h2 className="text-2xl md:text-xl font-black text-[#061735] tracking-[0.18em] uppercase">{title}</h2>
                <div className="h-px bg-gradient-to-r from-transparent via-orange-400 to-transparent w-20"></div>
            </div>
        );

        function SpringConcertProgram() {
            const [lang, setLang] = useState('en');
            const [view, setView] = useState('home');
            const t = TRANSLATIONS[lang];

            const getGroupData = (groupName) => {
                const groupMembers = ROSTER_DATA.filter(s => s.group === groupName);
                return sortRoster(groupMembers);
            };

            const handleLangToggle = () => setLang(prev => prev === 'en' ? 'es' : 'en');

            const renderHome = () => (
                <div className="animate-in fade-in zoom-in duration-500">
                    <div className="text-center mb-10 space-y-3">
                        <div className="w-20 h-20 md:w-16 md:h-16 bg-orange-500 rounded-3xl rotate-[-6deg] mx-auto mb-6 flex items-center justify-center shadow-[0_0_35px_rgba(249,115,22,0.55)]">
                            <Music className="text-blue-950 w-10 h-10 md:w-8 md:h-8 rotate-[6deg]" />
                        </div>
                        <h1 className="text-5xl md:text-4xl font-black text-[#061735] tracking-tight leading-tight px-4 drop-shadow-[0_4px_18px_rgba(249,115,22,0.25)]">{t.title}</h1>
                        <p className="text-[#0a2a66] font-semibold text-xl md:text-lg tracking-wide">{t.school}</p>
                        <div className="flex flex-col items-center justify-center space-y-3 mt-6 text-orange-600 text-base md:text-sm font-bold">
                            <div className="flex items-center space-x-3">
                                <Calendar size={20} />
                                <span className="text-lg md:text-base">{t.date}</span>
                            </div>
                            <div className="flex items-center space-x-3">
                                <MapPin size={20} />
                                <span className="text-lg md:text-base">{t.location}</span>
                            </div>
                        </div>
                    </div>

                    <SectionHeader title={t.perfGroups} />

                    <div className="space-y-5 max-w-lg mx-auto">
                        <Card onClick={() => setView('symphonicBand')}>
                            <h3 className="text-2xl md:text-xl font-bold text-white mb-2">{t.symphonicBand}</h3>
                            <p className="text-blue-100 text-base md:text-sm">{t.school}</p>
                        </Card>
                        <Card onClick={() => setView('symphonicWinds')}>
                            <h3 className="text-2xl md:text-xl font-bold text-white mb-2">{t.symphonicWinds}</h3>
                            <p className="text-blue-100 text-base md:text-sm">{t.school}</p>
                        </Card>
                    </div>

                    <div className="mt-12 grid grid-cols-2 gap-5 max-w-lg mx-auto">
                        <Card onClick={() => setView('thanks')} className="h-full flex flex-col items-center justify-center py-8">
                            <Heart className="w-8 h-8 md:w-6 md:h-6 text-orange-300 mb-3" />
                            <span className="text-white font-semibold text-lg md:text-base">{t.specialThanks}</span>
                        </Card>
                        <Card onClick={() => setView('events')} className="h-full flex flex-col items-center justify-center py-8">
                            <Info className="w-8 h-8 md:w-6 md:h-6 text-orange-300 mb-3" />
                            <span className="text-white font-semibold text-lg md:text-base">{t.nextEvents}</span>
                        </Card>
                    </div>
                </div>
            );

            const renderGroupPage = (groupName, titleKey) => {
                const sortedStudents = getGroupData(groupName);
                const byInstrument = sortedStudents.reduce((acc, student) => {
                    const inst = student.instrument || "Unknown";
                    if (!acc[inst]) acc[inst] = [];
                    acc[inst].push(student);
                    return acc;
                }, {});

                // Get the correct conductor and selections based on the band
                let conductorName = "";
                let selections = [];

                if (titleKey === 'symphonicWinds') {
                    conductorName = t.conductorSymphonicWinds;
                    selections = t.selectionsSymphonicWinds;
                } else if (titleKey === 'symphonicBand') {
                    conductorName = t.conductorSymphonicBand;
                    selections = t.selectionsSymphonicBand;
                }

                return (
                    <div className="animate-in slide-in-from-right duration-300">
                        <h2 className="text-4xl md:text-3xl font-black text-[#061735] mb-3 text-center">{t[titleKey]}</h2>
                        <p className="text-center text-[#0a2a66] mb-10 text-lg md:text-base">{t.conductor}: <span className="text-[#061735] italic font-semibold">{conductorName}</span></p>
                        <div className="bg-[#092451]/75 rounded-2xl p-6 md:p-8 mb-10 border-2 border-orange-400/40 shadow-lg shadow-blue-950/30">
                            <h3 className="text-orange-300 font-black uppercase tracking-[0.2em] text-lg md:text-sm mb-6 text-center border-b-2 border-orange-400/30 pb-3">{t.program}</h3>
                            <ul className="space-y-5 md:space-y-4">
                                {selections.map((song, idx) => (
                                    <li key={idx} className="text-center">
                                        <span className="text-white font-semibold text-xl md:text-lg">{song}</span>
                                    </li>
                                ))}
                            </ul>
                        </div>
                        <SectionHeader title={t.musicians} />
                        <div className="grid grid-cols-1 gap-8 md:gap-6 pb-24">
                            {INSTRUMENT_SCORE_ORDER.map(inst => {
                                if (!byInstrument[inst]) return null;
                                return (
                                    <div key={inst} className="mb-4 bg-[#092451]/55 rounded-xl p-6 md:p-5 border border-orange-400/25">
                                        <h4 className="text-orange-300 font-bold mb-4 text-xl md:text-lg text-center md:text-left">{t.instrumentLabels[inst] || inst}</h4>
                                        <ul className="space-y-2.5 md:space-y-1.5">
                                            {byInstrument[inst].map((s, i) => (
                                                <li key={i} className="text-blue-50 text-lg md:text-base text-center md:text-left leading-relaxed">{s.first} {s.last}</li>
                                            ))}
                                        </ul>
                                    </div>
                                );
                            })}
                        </div>
                    </div>
                );
            };

            const renderInfoPage = (type) => (
                <div className="animate-in slide-in-from-right duration-300 h-full">
                    <div className="bg-[#092451]/90 p-8 md:p-10 rounded-2xl border-2 border-orange-400/40 shadow-xl shadow-blue-950/40">
                        {type === 'thanks' ? (
                            <>
                                <Heart className="w-16 h-16 md:w-12 md:h-12 text-orange-300 mx-auto mb-6" />
                                <h2 className="text-3xl md:text-2xl font-black text-white mb-6 text-center">{t.thanksHeader}</h2>

                                <div className="text-left max-w-2xl mx-auto">
                                    <p className="text-blue-50 leading-relaxed mb-6 text-lg md:text-base">{t.thanksIntro}</p>

                                    <ul className="space-y-2 text-blue-100 text-base md:text-sm mb-6">
                                        {t.thanksStaff.map((staff, idx) => (
                                            <li key={idx} className="leading-relaxed">{staff}</li>
                                        ))}
                                    </ul>

                                    <p className="text-blue-50 leading-relaxed mb-8 text-lg md:text-base">{t.thanksClosing}</p>

                                    <div className="border-t-2 border-orange-400/30 pt-8 mt-8">
                                        <h3 className="text-orange-300 font-bold text-xl md:text-lg mb-4 text-center">{t.fundraiserHeader}</h3>
                                        <p className="text-blue-50 leading-relaxed mb-6 text-base md:text-sm">{t.fundraiserIntro}</p>

                                        <ul className="grid grid-cols-1 md:grid-cols-2 gap-2 text-blue-100 text-base md:text-sm">
                                            {t.topDonors.map((donor, idx) => (
                                                <li key={idx} className="leading-relaxed">• {donor}</li>
                                            ))}
                                        </ul>
                                    </div>
                                </div>
                            </>
                        ) : (
                            <>
                                <Calendar className="w-16 h-16 md:w-12 md:h-12 text-orange-300 mx-auto mb-6" />
                                <h2 className="text-3xl md:text-2xl font-black text-white mb-4 text-center">{t.endOfYearHeader}</h2>
                                <p className="text-blue-100 leading-relaxed mb-8 text-center max-w-2xl mx-auto text-base md:text-sm">{t.endOfYearIntro}</p>
                                <div className="space-y-5 text-left max-w-2xl mx-auto w-full">
                                    {t.endOfYearItems.map((item, idx) => (
                                        <div key={idx} className="bg-blue-950/35 border border-orange-400/30 rounded-xl p-5">
                                            <h3 className="text-orange-300 font-black uppercase tracking-wider text-base md:text-sm mb-2">{item.title}</h3>
                                            <p className="text-blue-50 text-lg md:text-base leading-relaxed">{item.body}</p>
                                        </div>
                                    ))}
                                </div>
                            </>
                        )}
                    </div>
                </div>
            );

            return (
                <div className="relative min-h-screen font-sans selection:bg-orange-400 selection:text-blue-950">
                    <Background />
                    <div className="sticky top-0 z-50 bg-[#fff4df]/95 backdrop-blur-md border-b-2 border-orange-400/50 px-5 py-4 md:py-3 shadow-lg shadow-orange-900/10">
                        <div className="grid grid-cols-3 items-center gap-4">
                            {/* Left: Back Button (when not on home) */}
                            <div className="flex justify-start">
                                {view !== 'home' ? (
                                    <button onClick={() => setView('home')} className="flex items-center text-[#061735] hover:text-orange-600 transition-colors font-semibold text-base md:text-sm py-2" style={{ minHeight: '48px' }}>
                                        <ChevronLeft size={24} className="mr-1" />
                                        <span className="hidden sm:inline">{t.back}</span>
                                    </button>
                                ) : (
                                    <div style={{ minHeight: '48px' }}></div>
                                )}
                            </div>

                            {/* Center: Title */}
                            <div className="flex justify-center">
                                <span className="text-[#061735] text-sm md:text-xs font-bold tracking-widest uppercase text-center">{t.shortTitle}</span>
                            </div>

                            {/* Right: Language Toggle */}
                            <div className="flex justify-end">
                                <button onClick={handleLangToggle} className="flex items-center space-x-2 bg-[#061735] hover:bg-[#0c316d] active:bg-blue-800 text-orange-300 px-4 py-2.5 md:py-2 rounded-full text-base md:text-sm font-semibold transition-colors border-2 border-orange-400/70 shadow-md shadow-blue-950/20" style={{ minHeight: '48px' }}>
                                    <Globe size={18} />
                                    <span>{lang === 'en' ? 'Español' : 'English'}</span>
                                </button>
                            </div>
                        </div>
                    </div>
                    <main className="relative z-10 container mx-auto px-5 md:px-4 py-10 md:py-8 max-w-3xl">
                        {view === 'home' && renderHome()}
                        {view === 'symphonicBand' && renderGroupPage('Symphonic Band', 'symphonicBand')}
                        {view === 'symphonicWinds' && renderGroupPage('Symphonic Winds', 'symphonicWinds')}
                        {view === 'thanks' && renderInfoPage('thanks')}
                        {view === 'events' && renderInfoPage('events')}
                    </main>
                    <footer className="relative z-10 text-center py-8 text-[#061735]/65 text-base md:text-xs">
                        <p>{t.footerText}</p>
                    </footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<SpringConcertProgram />);
    </script>
</body>

</html>
